upstream auth_service {
    server auth-service:8001;
}

upstream payroll_service {
    server payroll-service:8002;
}

upstream dashboard_service {
    server dashboard-service:8003;
}

upstream kp_service {
    server kp-service:8004;
}

upstream funnel_service {
    server funnel-service:8007;
}

upstream pix_service {
    server pix-service:8006;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # --- auth-service: авторизация, справочники, админка ---
    location /api/auth/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/admin/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/departments {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
    }

    location = /api/positions {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
    }

    location = /api/grades {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
    }

    # --- payroll-service: расчёт ЗП ---
    location /api/payroll/ {
        proxy_pass http://payroll_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- dashboard-service: дашборд руководителя ---
    location /api/head/ {
        proxy_pass http://dashboard_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- kp-service: конструктор КП ---
    location /api/kp/ {
        proxy_pass http://kp_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://auth_service/health;
        proxy_set_header Host $host;
    }

    # --- funnel-service: воронка продаж «Промышленная маркировка» ---
    location = /funnel {
        return 301 /funnel/;
    }

    # trailing slash в proxy_pass срезает префикс /funnel/ — сервис отдаёт статику из корня
    location /funnel/ {
        proxy_pass http://funnel_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- pix-service: калькулятор внедрения PIX Operator ---
    location = /pix {
        return 301 /pix/;
    }

    location /pix/ {
        proxy_pass http://pix_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- frontend: приложение-монолит ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
